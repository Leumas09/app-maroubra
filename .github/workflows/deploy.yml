# Tests à chaque push et pull request ; sur main, build de l'image, publication dans l'ACR du socle
# et mise à jour de la Container App, en OIDC et sans secret GitHub.
# Variables de dépôt (pas des secrets) : AZURE_CLIENT_ID (client de id-maroubra-ci), AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, APP_NAME.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: crkiwiapps.azurecr.io
  APP_NAME: ${{ vars.APP_NAME }}
  IMAGE: crkiwiapps.azurecr.io/${{ vars.APP_NAME }}:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Numéro de version incrémenté (pull request)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          base=$(git show FETCH_HEAD:package.json | jq -r '.version // "0.0.0"')
          head=$(jq -r '.version // "0.0.0"' package.json)
          echo "Version : $base sur ${{ github.base_ref }}, $head ici"
          if [ "$head" = "$base" ] || [ "$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -1)" != "$head" ]; then
            echo "::error file=package.json::Incrémenter la version (npm version minor|patch --no-git-tag-version) : $head n'est pas supérieure à $base."
            exit 1
          fi
      - run: npm ci
      - name: Vérification des types
        run: |
          npx tsc --noEmit -p apps/hub
          npx tsc --noEmit -p apps/web
      - name: Tests (moteur du ciel contre Skyfield, serveur, sources, marée)
        run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Connexion Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Connexion au registre
        run: az acr login --name "${REGISTRY%%.*}"

      - name: Build et push
        run: |
          docker build --build-arg VERSION=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Mise à jour de la Container App
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "rg-app-$APP_NAME" \
            --image "$IMAGE" \
            --query "properties.latestRevisionName" -o tsv

      - name: Vérification du déploiement
        run: |
          # L'app est éteinte de 22 h 30 à 6 h 30 à Sydney (infra/project.bicep) : rien à vérifier, la nouvelle
          # image démarre au réveil. Marge de 10 min autour des bornes (démarrage, refroidissement).
          hm=$(TZ=Australia/Sydney date +%H%M)
          if [ "$hm" -ge 2220 ] || [ "$hm" -lt 0640 ]; then
            echo "App éteinte la nuit à Sydney ($hm) : image en place, vérification au prochain déploiement de jour."
            exit 0
          fi
          for i in $(seq 1 30); do
            h=$(curl -sf "https://$APP_NAME.apps.akakiwi.com/health" || true)
            v=$(echo "$h" | jq -r .version 2>/dev/null || true)
            [ "$v" = "${{ github.sha }}" ] && echo "Version servie : $(echo "$h" | jq -r .release) ($v)" && exit 0
            sleep 10
          done
          echo "La version servie n'est pas ${{ github.sha }}" && exit 1
